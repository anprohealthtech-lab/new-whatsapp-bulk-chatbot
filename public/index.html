<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Agent</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <div>
          <p class="eyebrow">Voice Agent</p>
          <h1>Live browser test console</h1>
        </div>

        <div class="tenant-grid">
          <label>
            <span>Organization ID</span>
            <input id="organizationId" type="text" placeholder="Organization UUID from main app" />
          </label>
          <label>
            <span>User ID</span>
            <input id="userId" type="text" placeholder="User UUID from main app" />
          </label>
        </div>

        <div class="controls">
          <button id="talkButton" type="button">Start</button>
          <span id="status">Idle</span>
        </div>

        <div class="log" id="log"></div>
      </section>
    </main>

    <script src="/main.js"></script>
  </body>
</html>
